<!doctype html>
<html lang="ko" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>편한 법전</title>
<meta name="description" content="초성 검색, 조문번호 키패드, 탭으로 보는 법령 뷰어">
<meta name="theme-color" content="#2e7d6b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --accent:#2e7d6b;--accent-weak:rgba(46,125,107,.13);--on-accent:#fff;
  --bg:#fbfbf8;--fg:#1d1f1e;--muted:#6b7370;--line:#d3dbd7;--panel:#fff;--key:#fff;
  --mark:#ffe28a;--rev:#8a918d;--hl:#d0342c;
  --fs:17px;--lh:1.8;--ls:0em;
  --ff:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root[data-theme="auto"]{--accent:#5fbfa5;--accent-weak:rgba(95,191,165,.16);--on-accent:#0e1413;--bg:#121514;--fg:#e2e7e4;--muted:#9aa49f;--line:#2b3331;--panel:#191d1c;--key:#1d2322;--mark:#6a5a17;--rev:#7f8984;--hl:#ff7b72;color-scheme:dark}
}
:root[data-theme="dark"]{--accent:#5fbfa5;--accent-weak:rgba(95,191,165,.16);--on-accent:#0e1413;--bg:#121514;--fg:#e2e7e4;--muted:#9aa49f;--line:#2b3331;--panel:#191d1c;--key:#1d2322;--mark:#6a5a17;--rev:#7f8984;--hl:#ff7b72;color-scheme:dark}
:root[data-theme="sepia"]{--accent:#2c6b5b;--accent-weak:rgba(44,107,91,.13);--bg:#f4ecd8;--fg:#3a3125;--muted:#7a6d58;--line:#d9ccb0;--panel:#efe5cc;--key:#f8f1df;--mark:#f3cf6b;--rev:#8f8168;--hl:#b23a2a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg)}
body{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
svg{display:block}
[hidden]{display:none!important}
#app{display:flex;flex-direction:column;height:100%}
#top{flex:none;background:var(--panel);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
#tabs{display:flex;height:50px}
.tab{flex:1 1 0;min-width:0;border:0;background:none;font-size:16px;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px;color:var(--fg)}
.tab.on{color:var(--accent);font-weight:700}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--accent)}
.tab.empty{color:var(--muted);font-size:22px;font-weight:300}
#findbar{display:flex;align-items:center;height:50px;gap:2px;padding-right:4px}
#findbar input{flex:1;min-width:0;height:40px;border:0;background:none;color:var(--fg);font-size:17px;outline:none;padding:0 4px}
#findCount{font-size:13px;color:var(--muted);white-space:nowrap;padding:0 4px}
.ib{width:44px;height:44px;border:0;background:none;color:var(--accent);display:flex;align-items:center;justify-content:center;border-radius:8px;flex:none}
.ib:active{background:var(--accent-weak)}
.ib svg{width:24px;height:24px}
#content{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;padding:4px 16px 45vh;-webkit-overflow-scrolling:touch}
.doc{max-width:46em;margin:0 auto;font-family:var(--ff);font-size:var(--fs);line-height:var(--lh);letter-spacing:var(--ls);word-break:keep-all;overflow-wrap:anywhere}
.law-title{text-align:center;color:var(--accent);font-size:1.22em;font-weight:700;margin:.7em 0 .15em;line-height:1.45}
.law-info{text-align:center;font-size:.82em;color:var(--muted);margin-bottom:.6em}
.help-notice{max-width:32em;margin:.4em auto 1em;padding:.7em 1em;border:1px solid var(--line);border-radius:8px;background:var(--accent-weak);text-align:center;font-size:.9em;line-height:1.6}
.help-notice a{color:var(--accent);font-weight:700;text-underline-offset:3px}
.help-notice .hn-url{font-size:.85em;color:var(--muted);user-select:all;-webkit-user-select:all}
.soon{color:var(--hl);font-weight:600}
.hd{text-align:center;color:var(--accent);font-weight:600;margin:1.3em 0 .5em;line-height:1.5}
.hd.lv-편{font-size:1.14em}.hd.lv-장{font-size:1.07em}
.art{margin:.9em 0;border-radius:6px;transition:background .3s}
.at{color:var(--accent);font-weight:700}
.tblock .at{display:block}
.ln{margin:.12em 0}
.ln.ho{padding-left:1.5em;text-indent:-1.5em}
.ln.mok{padding-left:2.9em;text-indent:-1.4em}
.ln.hang{padding-left:0}
.art.del{color:var(--muted)}
.rev{color:var(--rev);font-size:.84em}
.norev .rev{display:none}
a.ref{color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.art.flash{animation:flash 1.3s ease-out}
@keyframes flash{0%,30%{background:var(--accent-weak)}100%{background:transparent}}
.art.speaking{background:var(--accent-weak)}
mark{background:var(--mark);color:inherit;border-radius:2px}
mark.cur{outline:2px solid var(--accent)}
.add{margin:.8em 0;font-size:.92em}
.addh{color:var(--accent);font-weight:600}
.add .body{white-space:pre-wrap}
.empty-state{max-width:22em;margin:22vh auto 0;text-align:center;color:var(--muted);line-height:1.7;font-size:15px}
.empty-state .big{font-size:20px;color:var(--fg);margin-bottom:6px}
#keypad{flex:none;background:var(--panel);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
#keypad .grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;max-width:760px;margin:0 auto}
#keypad button{height:46px;border:1px solid var(--line);background:var(--key);color:var(--accent);font-size:21px;border-radius:6px;display:flex;align-items:center;justify-content:center;padding:0}
#keypad button:active{background:var(--accent-weak)}
#keypad button.on{background:var(--accent);color:var(--on-accent)}
#keypad svg{width:23px;height:23px}
#keypad .ui{font-size:19px}
#pill{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--accent);color:var(--on-accent);padding:7px 18px;border-radius:20px;font-size:18px;font-weight:700;z-index:30;box-shadow:0 4px 14px rgba(0,0,0,.18);pointer-events:none;white-space:nowrap}
#pill small{font-weight:400;font-size:13px;opacity:.85;margin-left:6px}
#toast{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(30,34,33,.92);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:80;max-width:88vw;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
#ttsBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(122px + env(safe-area-inset-bottom));z-index:25;width:min(520px,calc(100% - 20px));background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 22px rgba(0,0,0,.2);padding:8px 12px 6px}
#ttsBar .tb-top{display:flex;align-items:baseline;gap:8px;font-size:14px;line-height:1.3}
#ttsBar .tb-now{flex:1;min-width:0;color:var(--accent);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ttsBar .tb-cnt{color:var(--muted);font-size:12.5px;white-space:nowrap}
#ttsBar .tb-prog{position:relative;height:6px;border-radius:3px;background:var(--line);margin:8px 0 2px;cursor:pointer;overflow:hidden}
#ttsBar .tb-prog::before{content:"";position:absolute;inset:-8px 0}
#ttsBar .tb-prog i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .25s linear}
#ttsBar.paused .tb-prog i{opacity:.55}
#ttsBar .tb-row{display:flex;align-items:center;gap:4px}
#ttsBar .tb-t{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:4.6em}
#ttsBar .tb-t:last-child{text-align:right}
#ttsBar .tb-ctl{flex:1;display:flex;justify-content:center;gap:6px}
#ttsBar .tb-ctl button{width:44px;height:44px;border:0;border-radius:50%;background:none;color:var(--accent);display:flex;align-items:center;justify-content:center}
#ttsBar .tb-ctl button:active{background:var(--accent-weak)}
#ttsBar .tb-ctl button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#ttsBar .tb-ctl button svg{width:22px;height:22px}
#ttsBar .tb-ctl .main{background:var(--accent);color:var(--on-accent);width:50px;height:50px}
#ttsBar .tb-ctl .main:active{background:var(--accent);opacity:.85}
.panel{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:40;animation:pin .16s ease-out}
@keyframes pin{from{transform:translateX(18px);opacity:.4}to{transform:none;opacity:1}}
.ph{display:flex;align-items:center;flex:none;min-height:52px;border-bottom:1px solid var(--line);background:var(--panel);padding:env(safe-area-inset-top) 4px 0}
.ph h2{flex:1;text-align:center;margin:0;font-size:18px;color:var(--accent);letter-spacing:.12em;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .pa{display:flex;min-width:44px;justify-content:flex-end}
.pb{flex:1;overflow-y:auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom))}
.pb .wrap{max-width:720px;margin:0 auto}
.pf{flex:none;border-top:1px solid var(--line);background:var(--panel);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:12px;justify-content:center;align-items:center}
.sinput{width:100%;font-size:18px;padding:12px 14px;border:1.5px solid var(--accent);border-radius:8px;background:var(--panel);color:var(--fg);outline:none}
.meta{font-size:12.5px;color:var(--muted);margin:8px 2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.meta .sp{flex:1}
.linkbtn{border:0;background:none;color:var(--accent);font-size:13px;padding:4px 2px;text-decoration:underline;text-underline-offset:2px}
.rlist{border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.ritem{display:flex;align-items:center;min-height:52px;border-bottom:1px solid var(--line)}
.ritem:last-child{border-bottom:0}
.ritem .nm{flex:1;min-width:0;padding:12px 14px;font-size:16.5px;line-height:1.4;cursor:pointer}
.ritem .nm:active{background:var(--accent-weak)}
.ritem .sub{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.ritem .plus{width:48px;align-self:stretch;border:0;border-left:1px solid var(--line);background:none;color:var(--accent);display:flex;align-items:center;justify-content:center}
.ritem .plus svg{width:20px;height:20px}
.ritem .del{color:var(--muted)}
.ritem .del:hover,.ritem .del:focus-visible{color:var(--hl)}
.ritem .sz{color:var(--muted)}
.ritem.gone{opacity:.4;pointer-events:none}
.hl{color:var(--hl);font-weight:700}
.sec{font-size:13px;color:var(--muted);margin:16px 2px 6px}
.note{font-size:13.5px;color:var(--muted);line-height:1.6;margin:10px 2px}
.toc{font-size:16px}
.toc .ti{padding:10px 8px;border-bottom:1px solid var(--line);cursor:pointer;line-height:1.45}
.toc .ti:active{background:var(--accent-weak)}
.toc .th{color:var(--accent);font-weight:700;background:var(--accent-weak)}
.toc .th.lv-절,.toc .th.lv-관{font-weight:600;padding-left:18px;background:none}
.toc .ta{padding-left:22px}
.toc .ta.now{color:var(--accent);font-weight:700}
.toc .ta .rev{display:none}
.row{display:flex;align-items:center;gap:8px;min-height:56px;border-bottom:1px solid var(--line);padding:6px 2px}
.row>.lb{flex:1;font-size:16px}
.row>.lb small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.row input[type=range]{flex:1.3;accent-color:var(--accent);min-width:80px}
.row select{font-size:15px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);max-width:46vw}
.row input[type=text],.row input[type=url],.row input[type=password]{flex:1.4;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);min-width:0}
.tbtn{border:0;background:none;color:var(--accent);font-size:16px;padding:8px 6px;font-weight:600}
.btn{border:1.5px solid var(--accent);color:var(--accent);background:none;border-radius:8px;padding:9px 14px;font-size:15px;font-weight:600}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.45}
.seg{display:flex;border:1.5px solid var(--accent);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;color:var(--accent);padding:8px 12px;font-size:14px}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw:checked{background:var(--accent)}
.sw:checked::after{left:21px}
.preview{border:1px solid var(--line);border-radius:8px;padding:6px 14px;max-height:36vh;overflow:auto;background:var(--bg);margin-bottom:6px}
.menu .mi{display:flex;align-items:center;gap:14px;padding:15px 6px;border-bottom:1px solid var(--line);font-size:16.5px;cursor:pointer}
.menu .mi:active{background:var(--accent-weak)}
.menu .mi svg{width:22px;height:22px;color:var(--accent);flex:none}
.cbx{width:22px;height:22px;accent-color:var(--accent);flex:none}
.tts .grp{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);font-size:16px;line-height:1.45}
.tts .grp .cnt{color:var(--muted);font-size:12.5px;white-space:nowrap}
.pbtn{width:120px;height:56px;border-radius:10px;border:0;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center}
.pbtn svg{width:28px;height:28px}
.cache .ci{display:flex;align-items:center;gap:6px;padding:10px 2px;border-bottom:1px solid var(--line)}
.cache .ci .nm{flex:1;min-width:0;font-size:15px}
.cache .ci small{display:block;color:var(--muted);font-size:12px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:520px;border-radius:14px 14px 0 0;padding:8px 0 calc(8px + env(safe-area-inset-bottom));animation:sup .16s ease-out}
@keyframes sup{from{transform:translateY(30px)}to{transform:none}}
.sheet .st{padding:12px 20px 8px;color:var(--muted);font-size:13.5px}
.sheet button{display:block;width:100%;text-align:left;border:0;background:none;padding:15px 20px;font-size:16.5px}
.sheet button:active{background:var(--accent-weak)}
.loading{text-align:center;color:var(--muted);padding:30vh 0 0;font-size:15px}
.err{max-width:26em;margin:18vh auto 0;text-align:center;line-height:1.7;font-size:15px}
.err .msg{color:var(--hl);margin:8px 0 16px}
/* ===== 좌측 사이드바 (반응형) ===== */
:root{--sidew:300px}
#shell{display:flex;height:100%}
#app{flex:1;min-width:0}
#topRow{display:flex;align-items:stretch}
#topMain{flex:1;min-width:0}
#sideBtn{height:50px;width:46px;border-radius:0;border-right:1px solid var(--line)}
#side{flex:none;width:var(--sidew);display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line);padding-top:env(safe-area-inset-top)}
#side .sh{display:flex;align-items:center;gap:6px;height:50px;padding:0 8px;border-bottom:1px solid var(--line);flex:none}
#side .sh .seg{flex:1}
#side .sh .seg button{flex:1;padding:6px 8px}
#side .sq{flex:none;margin:8px 10px 6px;width:calc(100% - 20px);font-size:14.5px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg);outline:none}
#side .sq:focus{border-color:var(--accent)}
#side .sbody{flex:1;overflow-y:auto;min-height:0;padding:0 0 14px;position:relative;overscroll-behavior:contain}
.stoc .ti{padding:6px 12px 6px 14px;font-size:14px;line-height:1.45;cursor:pointer;border-left:3px solid transparent;word-break:keep-all}
.stoc .ti:hover{background:var(--accent-weak)}
.stoc .th{color:var(--accent);font-weight:700;font-size:13.5px;margin-top:6px}
.stoc .th.lv-절,.stoc .th.lv-관{padding-left:22px;font-weight:600;margin-top:0}
.stoc .ta{padding-left:24px;color:var(--fg)}
.stoc .ta.del{color:var(--muted)}
.stoc .ta.now{color:var(--accent);font-weight:700;background:var(--accent-weak);border-left-color:var(--accent)}
.stoc .rev{display:none}
.slaw .sec{margin:12px 14px 4px;font-size:12px}
.slaw .si{display:flex;align-items:center;border-left:3px solid transparent}
.slaw .si:hover{background:var(--accent-weak)}
.slaw .si.on{border-left-color:var(--accent);background:var(--accent-weak)}
.slaw .si .nm{flex:1;min-width:0;padding:8px 6px 8px 12px;font-size:14.5px;line-height:1.35;cursor:pointer}
.slaw .si.on .nm{color:var(--accent);font-weight:700}
.slaw .si .nm small{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:1px}
.slaw .si .plus{width:36px;height:36px;border:0;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;border-radius:6px;flex:none;margin-right:4px}
.slaw .si .plus:hover{color:var(--accent)}
.slaw .si .plus svg{width:17px;height:17px}
.star.on,.slaw .si .star.on{color:#e0a100}
.ritem .star.on{color:#e0a100}
.tab.temp{font-style:italic;color:var(--muted)}
.tab.temp.on{color:var(--accent)}
.tab{padding:0 6px}
.snote{font-size:13px;color:var(--muted);line-height:1.6;padding:10px 14px}
#side .sf{flex:none;border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:2px}
.sfbtn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 8px;border-radius:7px;font-size:14px;text-align:left;color:var(--fg)}
.sfbtn:hover,.sfbtn:active{background:var(--accent-weak)}
.sfbtn svg{width:19px;height:19px;color:var(--accent);flex:none}
.sfbtn small{color:var(--muted);font-size:12px;margin-left:auto;white-space:nowrap}
#sideBg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:49}
.dl-state{font-size:12px;color:var(--muted)}
@media (max-width:767.98px){
  #side{position:fixed;left:0;top:0;bottom:0;z-index:50;width:min(320px,86vw);transform:translateX(-104%);visibility:hidden;transition:transform .2s ease,visibility 0s linear .2s;box-shadow:4px 0 22px rgba(0,0,0,.22)}
  body.side-open #side{transform:none;visibility:visible;transition:transform .2s ease}
}
@media (min-width:768px){
  body.side-closed #side{display:none}
  #sideBg{display:none!important}
  #pill,#ttsBar{left:calc(50% + var(--sidew) / 2)}
  #ttsBar{width:min(520px,calc(100% - var(--sidew) - 24px))}
  body.side-closed #pill,body.side-closed #ttsBar{left:50%}
  body.side-closed #ttsBar{width:min(520px,calc(100% - 24px))}
}
@media (min-width:1280px){:root{--sidew:340px}}
@media (min-width:700px){#content{padding-left:28px;padding-right:28px}}
@media (prefers-reduced-motion:reduce){.panel,.sheet,.art.flash{animation:none}#side{transition:none!important}}
/* 조문 읽기: 조문 선택 */
.tts .tsel{margin:10px 0 6px}
.tts .tsel .lb{display:block;font-size:13px;color:var(--muted);margin:0 2px 6px}
.tts .tsel .sinput{font-size:17px;padding:10px 12px}
.tts .tmsg{min-height:1.3em;font-size:12.5px;color:var(--muted);margin:5px 2px 0}
.tts .tmsg.bad{color:var(--hl)}
.tts .tbar{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}

    if (inAdd) {
      if (!line.trim()) continue;
      const t = unesc(line.trim());

      } else {
        if (!add) { add = { h: '', x: '' }; addenda.push(add); }
        add.x += (add.x ? '\n' : '') + t;
      }
      continue;
    }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      const lvl = h[1].length;
      const text = unesc(h[2].trim());

        const a = text.match(/^제\s*(\d+)\s*조(?:\s*의\s*(\d+))?\s*(?:\((.*)\))?\s*(.*)$/);

    mst: fm['법령MST'] || '',

    kind: fm['법령구분'] || '법률',
    ef: d(fm['시행일자']),
    pd: d(fm['공포일자']),

  catch (e) { toast(`${p.n}: ${e.notFound ? '저장소에서 찾지 못했어요' : e.message}`, 4000); return false; }

}

// 본문 글자 위치 계산 (.nox = 단추·연결 표시 등 글자로 치지 않는 부분)

  return f.textContent.length;

function wrapText(line, s, e, cls, hi) {
  let t = 0;
  for (const n of txtNodes(line)) {
    const L = n.length, a = Math.max(s, t), b = Math.min(e, t + L);
    if (b > a) {
      let x = n;
      if (a > t) x = x.splitText(a - t);
      if (b < t + L) x.splitText(b - a);
      const sp = document.createElement('span'); sp.className = cls; sp.dataset.hi = hi;

function applyHl(sec, k) {

    const tx = lineText(ln);
    let s = h[1], e = h[2];
    if (tx.slice(s, e) !== h[3]) { const j = tx.indexOf(h[3]); if (j < 0) return; s = j; e = j + h[3].length; }

/* 형광펜: 글자를 고르면 뜨는 작은 막대 */
const SELBAR = (() => {

  document.body.appendChild(bar);
  let saved = null, t = 0;
  const hide = () => { bar.hidden = true; saved = null; };
  function check() {
    const s = getSelection();
    if (!s || !s.rangeCount || s.isCollapsed || !cur.law) return hide();
    const r = s.getRangeAt(0);
    const el = (n) => (n.nodeType === 1 ? n : n.parentElement);
    const a = el(r.startContainer).closest('.art'), b = el(r.endContainer).closest('.art');
    if (!a || a !== b || !C.contains(a) || el(r.commonAncestorContainer).closest('.nox')) return hide();
    saved = { r: r.cloneRange(), sec: a };
    const rect = r.getBoundingClientRect();

    const bw = bar.offsetWidth, bh = bar.offsetHeight;
    let top = rect.bottom + 10;
    if (top + bh > innerHeight - 140) top = Math.max(8, rect.top - bh - 10);
    bar.style.top = top + 'px';
    bar.style.left = Math.max(8, Math.min(innerWidth - bw - 8, rect.left + rect.width / 2 - bw / 2)) + 'px';
  }
  document.addEventListener('selectionchange', () => { clearTimeout(t); t = setTimeout(check, 180); });

  bar.addEventListener('pointerdown', (e) => e.preventDefault());
  bar.addEventListener('mousedown', (e) => e.preventDefault());
  bar.addEventListener('click', (e) => {
    const btn = e.target.closest('button'); if (!btn || !saved) return;
    const { r, sec } = saved, k = sec.dataset.k;
    if (btn.dataset.sb === 'memo') { getSelection().removeAllRanges(); hide(); return openMemo(k); }
    const c = btn.dataset.c;

      const tx = lineText(ln);
      const s = ln.contains(r.startContainer) ? offOf(ln, r.startContainer, r.startOffset) : 0;
      const e2 = ln.contains(r.endContainer) ? offOf(ln, r.endContainer, r.endOffset) : tx.length;

      if (PEND.length) h += `<div class="sec">불러온 목록 · 이 기기에 없는 법령 (${PEND.length})</div>` + pendRows('plus');
      const fl = favs.map((f) => LIST.find((it) => it.id === f.id) || prep({ n: f.name, id: f.id, k: '데이터 없음', a: '' }));
      h += `<div class="sec">즐겨찾기 · 상단 탭 (${favs.length}/${FAV_MAX})</div>` + (fl.length ? fl.map((it) => row(it, esc(it.n))).join('') : '<div class="snote" style="padding-top:2px">법령 옆 ☆를 누르면 상단 탭에 고정돼요.</div>');
      if (LIST.length <= 1) h += '<div class="snote">아직 법령이 없어요. 아래 "GitHub에서 법령 받기"나 "내 폴더 연결"로 법령을 추가하세요.</div>';
      for (const [src, title] of [['', '기본 법령'], ['gh', 'GitHub에서 받은 법령'], ['dir', '내 폴더'], ['http', '같은 폴더(자동 인식)']]) {
        const items = LIST.filter((it) => (it.src || '') === src && it.id !== HELP.id && !isFav(it.id));
        if (items.length) h += `<div class="sec">${title}</div>` + items.map((it) => row(it, esc(it.n))).join('');
      }
      const hp = LIST.find((it) => it.id === HELP.id);
      if (hp && !isFav(hp.id)) h += '<div class="sec">기타</div>' + row(hp, '도움말');
    }
    body.innerHTML = `<div class="slaw">${h}</div>`;
  }
  function renderFoot() {
    const us = Object.values(USER);
    const nDir = us.filter((u) => u.src === 'dir').length, nHttp = us.filter((u) => u.src === 'http').length;
    let fb;
    if (LOCAL.state === 'need') fb = `<button type="button" class="sfbtn" data-f="regrant">${IC.refresh}<span>"${esc(LOCAL.name)}" 다시 읽기</span><small>권한 확인</small></button>`;
    else if (nDir || LOCAL.state === 'dir' || LOCAL.state === 'file') fb = `<button type="button" class="sfbtn" data-f="manage">${IC.folder}<span>내 폴더${LOCAL.name ? ': ' + esc(LOCAL.name) : ''}</span><small>${nDir}개</small></button>`;
    else fb = `<button type="button" class="sfbtn" data-f="connect">${IC.folder}<span>내 폴더 연결</span></button>`;
    foot.innerHTML = `<button type="button" class="sfbtn" data-f="gh">${IC.dl}<span>GitHub에서 법령 받기</span></button>${fb}` +
      (nHttp ? `<div class="snote" style="padding:2px 8px">같은 폴더에서 법령 ${nHttp}개를 자동으로 읽었어요</div>` : '') +
      `<button type="button" class="sfbtn" data-f="backup">${IC.swap}<span>데이터 저장·불러오기</span>${PEND.length ? `<small>받을 법령 ${PEND.length}</small>` : ''}</button>` +
      `<button type="button" class="sfbtn" data-f="menu">${IC.menu}<span>메뉴·설정</span></button>`;
  }
  function folderSheet() {
    const items = [];
    if (LOCAL.handle) items.push({ label: '폴더 다시 읽기', fn: () => syncLocal({ interactive: true }) });
    else items.push({ label: '폴더 다시 고르기(다시 읽기)', fn: () => $('#dirInput').click() });
    if (window.showDirectoryPicker && LOCAL.handle) items.push({ label: '다른 폴더 연결', fn: connectFolder });
    items.push({ label: 'md 파일 직접 추가', fn: () => $('#mdInput').click() });
    items.push({ label: '연결 해제 (폴더 법령 지우기)', fn: disconnectFolder });
    sheet(`내 폴더${LOCAL.name ? ' · ' + LOCAL.name : ''}`, items);
  }
  foot.addEventListener('click', (e) => {
    const b = e.target.closest('[data-f]'); if (!b) return;
    const f = b.dataset.f;
    if (f === 'gh') act(() => openSearch('', true));
    else if (f === 'menu') act(openMenu);
    else if (f === 'connect') connectFolder();
    else if (f === 'regrant') syncLocal({ interactive: true });
    else if (f === 'manage') folderSheet();
    else if (f === 'backup') act(openBackup);
  });
  document.addEventListener('lb-pend', () => { if (view === 'laws') refresh(); else dirty = true; renderFoot(); });
  fbtn.addEventListener('click', () => { favOnly = !favOnly; if (favOnly) memoOnly = false; LS.set('tocFav', favOnly); LS.set('tocMemo', memoOnly); drawToc(); if (!favOnly) track(true); else body.scrollTop = 0; });
  mbtn.addEventListener('click', () => { memoOnly = !memoOnly; if (memoOnly) favOnly = false; LS.set('tocFav', favOnly); LS.set('tocMemo', memoOnly); drawToc(); if (!memoOnly) track(true); else body.scrollTop = 0; });
  document.addEventListener('lb-note', () => {
    if (view !== 'toc' || !cur.law) return;
    if (!visible()) { dirty = true; return; }
    const y = body.scrollTop; drawToc(); body.scrollTop = y;
  });
  document.addEventListener('lb-artfav', () => {
    if (view !== 'toc' || !cur.law) return;
    if (!visible()) { dirty = true; return; }
    if (favOnly) { const y = body.scrollTop; drawToc(); body.scrollTop = y; }
    else fbtn.innerHTML = `${IC.star}<span>${afList(cur.law.id).length}</span>`;
  });
  body.addEventListener('click', (e) => {
    const sf = e.target.closest('.afb');
    if (sf) { toggleArtFav(sf.dataset.af); return; }
    if (e.target.closest('[data-sa]')) { const qq = lawQ; act(() => openSearch(qq, true)); return; }
    const ti = e.target.closest('.ti');
    if (ti) {
      const go = () => {
        if (ti.dataset.k) jumpKey(ti.dataset.k);
        else { const hd = $('#h-' + ti.dataset.h, C); if (hd) C.scrollTop = hd.offsetTop - 6; }
      };
      if (drawer) { back(); setTimeout(go, 60); } else go();
      return;
    }
    if (onPendClick(e)) return;
    const si = e.target.closest('.si');
    if (!si) return;
    const it = LIST.find((x) => x.id === si.dataset.id); if (!it) return;
    if (e.target.closest('.star')) { const y = body.scrollTop; toggleFav(it); body.scrollTop = y; return; }
    if (tabs[active] && tabs[active].id === it.id) { if (drawer) back(); return; }
    openLaw(it);
  });
  let qT = 0;
  q.addEventListener('input', () => {
    clearTimeout(qT);
    qT = setTimeout(() => { if (view === 'toc') { tocQ = q.value.trim(); drawToc(); } else { lawQ = q.value.trim(); drawLaws(); } }, 80);
  });
  q.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); const f = body.querySelector('.ta, .si .nm'); if (f) f.click(); }
  });
  $('#sideSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    view = b.dataset.v; LS.set('sideView', view); render();
  });
  let raf = 0;
  C.addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; track(false); }); }, { passive: true });
  return {
    toc: () => { tocQ = ''; if (view === 'toc') refresh(); else dirty = true; },
    laws: () => { if (view === 'laws') refresh(); else dirty = true; },
    track: () => track(true),
    foot: () => { renderFoot(); document.dispatchEvent(new Event('lb-local')); },
    toggle,
    init() { btn.innerHTML = IC.side; btn.addEventListener('click', toggle); applyOpen(); refresh(); renderFoot(); },
  };
})();
/* ================= 키보드(태블릿·PC) ================= */
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input,textarea,select') || STACK.length || e.ctrlKey || e.metaKey || e.altKey) return;
  if (TTS.on && e.key === ' ') { e.preventDefault(); return ttsPause(); }
  if (TTS.on && e.key === 'ArrowLeft') return ttsPrev();
  if (TTS.on && e.key === 'ArrowRight') return ttsNext();
  if (/^\d$/.test(e.key)) keyAction(e.key);
  else if (e.key === 'Backspace') keyAction('bs');
  else if (e.key === '-' || e.key === '.') keyAction('ui');
  else if (e.key === 'ArrowUp' && e.shiftKey) keyAction('up');
  else if (e.key === 'ArrowDown' && e.shiftKey) keyAction('down');
  else if (e.key === '/') { e.preventDefault(); keyAction('find'); }
  else if (e.key === 's') keyAction('search');
  else if (e.key === 'b' && cur.law) { const k = curKey(); if (k) toggleArtFav(k); }
  else if (e.key === '[' || e.key === '\\') SIDE.toggle();
});
/* ================= 시작 ================= */
async function boot() {
  normalizeTabs(); applyS(); buildKeypad(); renderTabs();
  history.replaceState({ l: 0 }, '');
  for (const f of customFonts) registerCustomFont(f.id);
  DB.del('ghIndex'); // 예전 버전의 GitHub 전체 목록 캐시 정리
  applyPending();
  buildList();
  SIDE.init();
  LOCAL.ready = syncLocal().catch(() => 0);
  showTab(active);
  LOCAL.ready.then(async () => {
    const t = tabs[active];
    if (!t || !USER[t.id] || USER[t.id].src === 'gh') return;
    if (!cur.law) return showTab(active);
    const L = await DB.get('law:' + t.id);
    if (L && cur.law.id === t.id && L.hash !== cur.law.hash) showTab(active, { key: curKey() });
  });
  let framed = false; try { framed = window.top !== window; } catch (e) { framed = true; }
  if ('serviceWorker' in navigator && !framed && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
boot();
})();
</script>
